name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Restore is implicit: NuGet audit warnings (NU1902/NU1903) are raised during restore.
      - name: Build
        run: dotnet build Exodus.sln -warnaserror:NU1902,NU1903
      - name: Test
        run: dotnet test Exodus.sln --no-build
